name: olx-enterprise

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: olx
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: postgres
    ports: ["5433:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./platform/docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olx -d postgres"]
      interval: 5s
      retries: 12

  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports: ["9092:9092"]

  redis-quota:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    ports: ["6379:6379"]
    volumes: ["redis_quota_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  redis-cache:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["6380:6379"]
    volumes: ["redis_cache_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:2.19.1
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports: ["9200:9200", "9600:9600"]
    volumes: ["opensearch_data:/usr/share/opensearch/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports: ["8085:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on: [kafka]

  moderation:
    build: ./platform/moderation-mock
    ports: ["8787:8787"]

  simple-api:
    profiles: ["simple"]
    build:
      context: ./solutions/simple
      dockerfile: Dockerfile
    environment:
      PORT: 8087
      DB_URL: jdbc:postgresql://postgres:5432/olx_simple
      DB_USER: olx
      DB_PASSWORD: ${DB_PASSWORD:-admin}
      MODERATION_URL: http://moderation:8787
    ports: ["8087:8087"]
    depends_on:
      postgres:
        condition: service_healthy
      moderation:
        condition: service_started

  prometheus:
    image: prom/prometheus:v3.5.0
    ports: ["9090:9090"]
    volumes:
      - ./platform/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:12.1.0
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin_local_only
    volumes:
      - grafana_data:/var/lib/grafana
      - ./platform/observability/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    depends_on: [prometheus]

  ads-service:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: services/ads-service/Dockerfile
    environment:
      OPENSEARCH_READ_TIMEOUT_MS: 10000
      APP_SIMULATION_ENABLED: "true"
      APP_SIMULATION_BASE_URL: http://localhost:8082
      MANAGEMENT_METRICS_DISTRIBUTION_PERCENTILESHISTOGRAM_HTTP_SERVER_REQUESTS: "true"
      PORT: 8082
      DB_URL: jdbc:postgresql://postgres:5432/ads
      DB_USER: olx
      DB_PASSWORD: ${DB_PASSWORD:-admin}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports: ["${ADS_HOST_PORT:-8082}:8082"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  moderation-worker:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: services/moderation-worker/Dockerfile
    environment:
      PORT: 8084
      DB_URL: jdbc:postgresql://postgres:5432/moderation
      DB_USER: olx
      DB_PASSWORD: ${DB_PASSWORD:-admin}
      REDIS_HOST: redis-quota
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MODERATION_URL: http://moderation:8787
      MANAGEMENT_METRICS_DISTRIBUTION_PERCENTILESHISTOGRAM_HTTP_SERVER_REQUESTS: "true"
    ports: ["8084:8084"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      redis-quota:
        condition: service_healthy
      moderation:
        condition: service_started

  ads-query-service:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: services/ads-query-service/Dockerfile
    environment:
      OPENSEARCH_READ_TIMEOUT_MS: 10000
      PORT: 8086
      REDIS_HOST: redis-cache
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OPENSEARCH_URL: http://opensearch:9200
      ADS_COMMAND_URL: http://ads-service:8082
      MANAGEMENT_METRICS_DISTRIBUTION_PERCENTILESHISTOGRAM_HTTP_SERVER_REQUESTS: "true"
    ports: ["8086:8086"]
    depends_on:
      kafka:
        condition: service_started
      redis-cache:
        condition: service_healthy
      opensearch:
        condition: service_healthy

  api-gateway:
    profiles: ["apps", "edge"]
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    environment:
      PORT: 8081
      ADS_URL: http://ads-service:8082
      ADS_QUERY_URL: http://ads-query-service:8086
      MANAGEMENT_METRICS_DISTRIBUTION_PERCENTILESHISTOGRAM_HTTP_SERVER_REQUESTS: "true"
    ports: ["8081:8081"]
    depends_on: [ads-service, ads-query-service]

  web:
    profiles: ["demo"]
    build: ./apps/web
    ports: ["3001:3000"]
    environment:
      NEXT_PUBLIC_API_BASE_URL: ""

  api-gateway-2:
    profiles: ["edge"]
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    environment:
      PORT: 8081
      ADS_URL: http://ads-service:8082
      ADS_QUERY_URL: http://ads-query-service:8086
    depends_on: [ads-service, ads-query-service]

  load-balancer:
    profiles: ["edge"]
    image: nginx:1.27-alpine
    ports: ["8088:80"]
    volumes:
      - ./platform/load-balancer/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [api-gateway, api-gateway-2]

volumes:
  postgres_data:
  grafana_data:
  redis_quota_data:
  redis_cache_data:
  opensearch_data: