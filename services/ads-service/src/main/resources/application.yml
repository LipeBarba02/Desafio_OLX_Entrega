server:
  port: ${PORT:8082}
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/ads}
    username: ${DB_USER:olx}
    password: ${DB_PASSWORD:admin}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:3000}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 30000
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record
app:
  kafka:
    topics:
      ad-submitted: ${KAFKA_AD_SUBMITTED_TOPIC:ads.submitted.v1}
      ad-moderation-decided: ${KAFKA_AD_MODERATION_DECIDED_TOPIC:ads.moderation-decided.v1}
    partitions: ${KAFKA_PARTITIONS:3}
    replicas: ${KAFKA_REPLICAS:1}
outbox:
  poll-delay-ms: ${OUTBOX_POLL_DELAY_MS:1000}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
