server:
  port: ${PORT:8083}
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/favorites}
    username: ${DB_USER:olx}
    password: ${DB_PASSWORD:olx}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
