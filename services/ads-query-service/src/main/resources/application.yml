server:
  port: ${PORT:8085}
spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      connect-timeout: 1s
      timeout: 1s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record
opensearch:
  url: ${OPENSEARCH_URL:http://localhost:9200}
  index: ${OPENSEARCH_INDEX:ads-v1}
  connect-timeout-ms: ${OPENSEARCH_CONNECT_TIMEOUT_MS:1000}
  read-timeout-ms: ${OPENSEARCH_READ_TIMEOUT_MS:2000}
ads:
  command:
    url: ${ADS_COMMAND_URL:http://localhost:8082}
app:
  kafka:
    topics:
      ad-moderation-decided: ${KAFKA_AD_MODERATION_DECIDED_TOPIC:ads.moderation-decided.v1}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
