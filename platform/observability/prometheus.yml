global:
  scrape_interval: 15s
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
  - job_name: ads-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["ads-service:8082"]
  - job_name: moderation-worker
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["moderation-worker:8084"]
  - job_name: ads-query-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["ads-query-service:8086"]
  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-gateway:8081"]
